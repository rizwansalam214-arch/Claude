<title>Sales &amp; SKU Dashboard</title>
<style>
/* Layout: top bar + filter bar, tabbed content in a centred column, analyst drawer slides in from the right. */

  --ink-2: #55534e;
  --muted: #86837b;
  --line: #e3e1da;
  --line-soft: #efede8;
  --accent: #7a4b26;          /* placeholder brand accent: swap for brand tokens */
  --accent-ink: #ffffff;
  --accent-soft: #f3ebe3;
  --s1: #2a78d6;              /* Actual */
  --s2: #eb6834;              /* Last year */
  --ref: #8f8c84;             /* Budget reference line */
  --good: #006300;
  --good-bg: #e6f2e4;
  --bad: #b42323;
  --bad-bg: #f8e5e3;
  --warn: #8a5a00;
  --warn-bg: #fbf0d6;
  --glass: rgba(255, 255, 255, 0.82);
  --shadow: 0 1px 2px rgba(18, 18, 17, 0.05), 0 4px 16px rgba(18, 18, 17, 0.05);
  --font: -apple-system, "SF Pro Text", "SF Pro Display", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --card: #1a1a19; --ink: #f4f3ef; --ink-2: #c3c2b7; --muted: #8f8c84;
    --line: #2f2e2b; --line-soft: #242422; --accent: #d39a63; --accent-ink: #1a1a19; --accent-soft: #2c2219;
    --s1: #3987e5; --s2: #d95926; --ref: #8f8c84;
    --good: #3fbf3f; --good-bg: #16290f; --bad: #ef7a7a; --bad-bg: #331a19; --warn: #e3b14b; --warn-bg: #2e2510;
    --glass: rgba(26, 26, 25, 0.86); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --card: #1a1a19; --ink: #f4f3ef; --ink-2: #c3c2b7; --muted: #8f8c84;
  --line: #2f2e2b; --line-soft: #242422; --accent: #d39a63; --accent-ink: #1a1a19; --accent-soft: #2c2219;
  --s1: #3987e5; --s2: #d95926; --ref: #8f8c84;
  --good: #3fbf3f; --good-bg: #16290f; --bad: #ef7a7a; --bad-bg: #331a19; --warn: #e3b14b; --warn-bg: #2e2510;
  --glass: rgba(26, 26, 25, 0.86); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 24px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--line); }

.fgroup { display: inline-flex; align-items: center; }
.fsel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font-size: 13px; max-width: 100%; }

/* Banner and tabs */
.banner { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding-block: 14px 4px; }
.banner b { color: var(--ink); font-weight: 600; }

.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 650; }
main { padding-block: 20px 64px; display: grid; gap: 16px; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chip.good { color: var(--good); background: var(--good-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.na { color: var(--muted); background: var(--line-soft); font-weight: 500; }

/* Chart */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; min-width: 150px; z-index: 5; }
.tip .t { font-weight: 650; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.tip .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.bars { display: grid; gap: 10px; }

/* Tables */
.tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.l, td.l { text-align: left; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--ink); }
td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 650; border-top: 1px solid var(--line); border-bottom: 0; }
td .desc { color: var(--muted); font-size: 12px; }
.abc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-weight: 700; font-size: 11px; background: var(--line-soft); color: var(--ink-2); }
.abc.A { background: var(--accent-soft); color: var(--accent); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; min-width: 0; width: 220px; max-width: 100%; }
.note { font-size: 12.5px; color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.empty h2 { font-size: 16px; margin-bottom: 6px; }

/* Data quality */
.dq-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .dq-grid { grid-template-columns: minmax(0, 1fr); } }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.status.ok { color: var(--good); }
.status.warn { color: var(--warn); }
.status.bad { color: var(--bad); }
.dq-list { display: grid; gap: 8px; margin-top: 10px; font-size: 13px; }
.dq-list div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line-soft); padding-bottom: 6px; }
.dq-list span:first-child { color: var(--ink-2); }

/* Analyst drawer */
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); z-index: 40; background: var(--glass); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px); border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgba(0,0,0,.12); display: flex; flex-direction: column; transform: translateX(105%); transition: transform 220ms ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.d-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 15px; margin: 0; }
.d-head .sub { font-size: 12px; color: var(--muted); }
.d-head .x { margin-left: auto; }
.d-body { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.msg { max-width: 100%; min-width: 0; font-size: 13.5px; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: 85%; }
.msg.ai { background: var(--card); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 12px 14px; }
.msg.ai p { margin: 0 0 8px; }
.msg.ai p:last-child { margin-bottom: 0; }
.msg.ai ul { margin: 0 0 8px; padding-left: 18px; }
.msg.ai table { font-size: 12px; margin: 6px 0 10px; }

.thinking { color: var(--muted); font-style: italic; }
.working { margin-top: 10px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line-soft); padding-top: 8px; }
.working summary { cursor: pointer; color: var(--muted); }
.working pre { white-space: pre-wrap; word-break: break-word; background: var(--line-soft); padding: 8px; border-radius: 8px; font-size: 11px; margin: 6px 0; max-height: 200px; overflow: auto; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.starters { display: grid; gap: 8px; }
.starters .cap { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sq { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-size: 13px; }
.sq:hover { border-color: var(--accent); }
.followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.followups button { font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-align: left; }

.d-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; }
.composer { display: flex; gap: 8px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--card); font: inherit; height: 44px; }
.scope-line { font-size: 11.5px; color: var(--muted); }
.unavail { font-size: 13px; color: var(--ink-2); background: var(--warn-bg); border-radius: 12px; padding: 12px; }
</style>

"use strict";
/* ======================================================================
   MOCK DATA — deterministic, shaped like rpt.FactSalesGL / FactSalesSku /
   FactBudgetSales. All amounts AED (SAR converted at 0.979333).
   ====================================================================== */
const FX_SAR = 0.979333;
const AS_OF = "05 Oct 2026, 02:14";
const MTD_DAYS = 5, OCT_DAYS = 31;

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const noise = (key, spread) => { const r = rng(key); return 1 + (r() + r() - 1) * spread; };

const SEGMENTS = [
  { code: "RETAIL", label: "Retail" },
  { code: "CAFE", label: "Café & El'an" },
  { code: "B2B", label: "B2B & Hotels" },

  { code: "ECOM", label: "E-commerce" },
  { code: "AIRLINES", label: "Airlines" },
  { code: "BULK", label: "Bulk Sales (Farms)" },
];
const SEG = Object.fromEntries(SEGMENTS.map(s => [s.code, s]));
const COMPANIES = { UAE: "Bateel UAE", KSA: "Bateel KSA", FAKHRA: "Al Fakhra" };
const SKU_RATIO = { RETAIL: .985, CAFE: .972, B2B: .948, TRAVEL: .99, JOMARA: .968, FRANCHISE: .93, ECOM: .958, AIRLINES: .99, BULK: .995 };
const OI_RATE = { RETAIL: .011, CAFE: .009, B2B: .002, TRAVEL: .001, JOMARA: .002, FRANCHISE: .045, ECOM: .004, AIRLINES: 0, BULK: .003 };

// base = average monthly AED in 2025; g = actual YoY growth 2026; bg = budgeted growth
const LINES = [

  { seg: "RETAIL", co: "KSA", sub: "Retail KSA", base: 3.1e6, g: .081, bg: .07 },

const mk = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
const MONTHS = [];
for (let y = 2024, m = 10; y < 2026 || (y === 2026 && m <= 10); m++) { if (m > 12) { m = 1; y++; } if (y === 2026 && m > 10) break; MONTHS.push(mk(y, m)); }
const prevYear = k => mk(+k.slice(0, 4) - 1, +k.slice(5));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monLabel = k => `${MON[+k.slice(5) - 1]} ${k.slice(0, 4)}`;

// Calendar seasonality; Ramadan / Eid moves earlier each year (Mar 2025 -> Feb/Mar 2026).
const SEASON = [1.0, .95, 1.0, .9, .88, .85, .78, .82, .92, .98, 1.08, 1.3];
const RAMADAN = { "2025-03": 1.32, "2026-02": 1.17, "2026-03": 1.2 };
function season(k) { return SEASON[+k.slice(5) - 1] * (RAMADAN[k] || 1); }
function cafeSeason(k) { return SEASON[+k.slice(5) - 1] * ({ "2025-03": .86, "2026-02": .95, "2026-03": .88 }[k] || 1); }

// Facts: ACT[line][month] (P&L basis AED), BUD[line][month] (2026)
const ACT = LINES.map(() => ({}));
const BUD = LINES.map(() => ({}));
LINES.forEach((L, i) => {
  const sf = L.seg === "CAFE" ? cafeSeason : season;
  for (const k of MONTHS) {
    const y = +k.slice(0, 4);
    const growth = y === 2026 ? 1 + L.g : y === 2024 ? 1 / (1 + L.g * .8) : 1;
    let v = L.base * sf(k) * growth * noise(`a${i}${k}`, .06);
    if (k === "2026-10") v = v * MTD_DAYS / OCT_DAYS;
    if (L.seg === "TRAVEL" && k === "2026-09") v *= .81;          // BSP settlement lag: September incomplete
    ACT[i][k] = v;
  }
  for (let m = 1; m <= 12; m++) {
    const k = mk(2026, m);
    BUD[i][k] = L.base * sf(k) * (1 + L.bg) * noise(`b${i}${k}`, .025);
  }
});

// SKU facts: SKUF[line][month] = [{s, sales, qty}]
const SKUF = LINES.map(() => ({}));
LINES.forEach((L, i) => {
  const skus = SKUS.filter(s => s.w[L.seg]);
  for (const k of MONTHS) {
    const mIdx = MONTHS.indexOf(k);
    const total = ACT[i][k] * SKU_RATIO[L.seg] * noise(`r${i}${k}`, .008);
    const shares = skus.map(s => s.w[L.seg] * Math.pow(1 + s.trend, mIdx / 12) * noise(`s${i}${s.no}${k}`, .12) *
      (s.desc.includes("Ramadan") ? (RAMADAN[k] ? 3 : .6) : 1));
    const sum = shares.reduce((a, b) => a + b, 0);
    SKUF[i][k] = skus.map((s, j) => {
      const sales = total * shares[j] / sum;
      const price = s.price * (1 + mIdx * .002) * noise(`p${s.no}${k}`, .02);
      return { s: s.idx, sales, qty: sales / price };
    });
  }
});

/* ======================================================================
   QUERY LAYER — the only path to data, for the screens and the analyst.
   Scope (persona) is applied here, before anything is returned.
   ====================================================================== */
const PERSONAS = {
  group: { name: "Group Finance", segs: SEGMENTS.map(s => s.code), cos: ["UAE", "KSA", "FAKHRA"], group: true },
  retail: { name: "Head of Retail", segs: ["RETAIL"], cos: ["UAE", "KSA"], group: false },
  jomara: { name: "Head of Jomara (UAE)", segs: ["JOMARA"], cos: ["UAE"], group: false },
};
const PERIODS = {
  "2026-10-MTD": { label: "Oct MTD", long: "October 2026 MTD (1–5 Oct)", months: ["2026-10"], mtd: true },
  "2026-09": { label: "Sep", long: "September 2026", months: ["2026-09"] },
  "2026-Q3": { label: "Q3", long: "Q3 2026 (Jul–Sep)", months: ["2026-07", "2026-08", "2026-09"] },
  "2026-YTD": { label: "YTD", long: "YTD September 2026 (Jan–Sep)", months: ["2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09"] },
};
function resolvePeriod(p) {
  if (PERIODS[p]) return PERIODS[p];
  if (/^\d{4}-\d{2}$/.test(p) && MONTHS.includes(p) && p >= "2025-10" && p <= "2026-09") return { label: monLabel(p), long: monLabel(p), months: [p] };
  throw new Error(`Unknown period "${p}". Use one of: ${Object.keys(PERIODS).join(", ")}, or a month YYYY-MM between 2025-10 and 2026-09.`);
}
const scopeOf = persona => PERSONAS[persona];

// Effective line filter = persona scope ∩ requested filters. Returns line indexes.
function linesFor(persona, { segment, company, sub } = {}) {
  const sc = scopeOf(persona);
  return LINES.map((L, i) => i).filter(i => {
    const L = LINES[i];
    if (!sc.segs.includes(L.seg) || !sc.cos.includes(L.co)) return false;
    if (segment && segment !== "ALL" && L.seg !== segment) return false;
    if (company && company !== "ALL" && L.co !== company) return false;
    if (sub && L.sub !== sub) return false;
    return true;
  });
}

function sumLines(idx, period, basis) {
  const P = resolvePeriod(period);
  let act = 0, bud = 0, ly = 0, qty = 0, oi = 0, budAvail = true;
  for (const i of idx) {
    const L = LINES[i];
    for (const k of P.months) {
      const lyk = prevYear(k);
      const lyFactor = P.mtd ? MTD_DAYS / OCT_DAYS : 1;
      const b = BUD[i][k];
      if (b == null) budAvail = false;
      const pBud = (b || 0) * (P.mtd ? MTD_DAYS / OCT_DAYS : 1);
      if (basis === "SKU") {
        act += SKUF[i][k].reduce((a, r) => a + r.sales, 0);
        ly += (SKUF[i][lyk] || []).reduce((a, r) => a + r.sales, 0) * lyFactor;
      } else {
        act += ACT[i][k];
        ly += (ACT[i][lyk] || 0) * lyFactor;
        oi += ACT[i][k] * OI_RATE[L.seg];
      }
      bud += pBud;
      qty += SKUF[i][k].reduce((a, r) => a + r.qty, 0);
    }
  }
  return { act, bud: basis === "SKU" || !budAvail ? null : bud, ly, qty, oi: basis === "SKU" ? null : oi };
}

function skuTable(persona, period, filt = {}) {
  const idx = linesFor(persona, filt);
  const P = resolvePeriod(period);
  const map = new Map();
  for (const i of idx) for (const k of P.months) {
    const lyk = prevYear(k);
    const lyF = P.mtd ? MTD_DAYS / OCT_DAYS : 1;
    for (const r of SKUF[i][k]) {
      const o = map.get(r.s) || { s: r.s, sales: 0, qty: 0, ly: 0 };
      o.sales += r.sales; o.qty += r.qty; map.set(r.s, o);
    }
    for (const r of (SKUF[i][lyk] || [])) {
      const o = map.get(r.s) || { s: r.s, sales: 0, qty: 0, ly: 0 };
      o.ly += r.sales * lyF; map.set(r.s, o);
    }
  }
  let rows = [...map.values()].map(o => ({ ...o, sku: SKUS[o.s] })).filter(r => r.sales > 0 || r.ly > 0);
  if (filt.category && filt.category !== "ALL") rows = rows.filter(r => r.sku.cat === filt.category);
  // ABC on net sales: A = top 80%, B = next 15%, C = rest
  const total = rows.reduce((a, r) => a + r.sales, 0);
  let cum = 0;
  [...rows].sort((a, b) => b.sales - a.sales).forEach(r => { cum += r.sales; r.abc = cum <= total * .8 + 1e-6 ? "A" : cum <= total * .95 ? "B" : "C"; });
  return rows;
}

function skuSpark(persona, sIdx, filt) {
  const idx = linesFor(persona, filt);
  return MONTHS.filter(k => k >= "2025-10" && k <= "2026-09").map(k =>
    idx.reduce((a, i) => a + (SKUF[i][k].find(r => r.s === sIdx)?.sales || 0), 0));
}

/* ======================================================================

   ====================================================================== */
const fmtAED = (v, d) => {
  if (v == null || isNaN(v)) return "—";
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e6) return `${s}${(a / 1e6).toFixed(d ?? 2)}M`;
  if (a >= 1e3) return `${s}${(a / 1e3).toFixed(d ?? 1)}K`;
  return `${s}${a.toFixed(0)}`;
};
const fmtFull = v => v == null ? "—" : "AED " + Math.round(v).toLocaleString("en-GB");
const fmtInt = v => Math.round(v).toLocaleString("en-GB");
const pct = (a, b) => (b ? (a - b) / Math.abs(b) : null);
const fmtPct = p => p == null ? "—" : `${p >= 0 ? "+" : "−"}${Math.abs(p * 100).toFixed(1)}%`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function chip(p, label) {
  if (p == null) return `<span class="chip na">${label ? esc(label) + " " : ""}n/a</span>`;
  const good = p >= 0;
  return `<span class="chip ${good ? "good" : "bad"}" aria-label="${good ? "favourable" : "unfavourable"} ${fmtPct(p)}">${good ? "▲" : "▼"} ${fmtPct(p)}${label ? " " + esc(label) : ""}</span>`;
}

function drawTrend() {
  const host = document.getElementById("trend");
  if (!host) return;
  const idx = linesFor(state.persona, filt());
  const months = Array.from({ length: 12 }, (_, i) => mk(2026, i + 1));
  const series = months.map(k => {
    const closed = k <= "2026-09";
    const a = closed ? (state.basis === "SKU" ? idx.reduce((s, i) => s + SKUF[i][k].reduce((x, r) => x + r.sales, 0), 0) : idx.reduce((s, i) => s + ACT[i][k], 0)) : null;
    const ly = state.basis === "SKU" ? idx.reduce((s, i) => s + SKUF[i][prevYear(k)].reduce((x, r) => x + r.sales, 0), 0) : idx.reduce((s, i) => s + ACT[i][prevYear(k)], 0);
    const b = state.basis === "SKU" ? null : idx.reduce((s, i) => s + BUD[i][k], 0);
    return { k, a, b, ly };
  });
  const W = Math.max(host.clientWidth, 280), H = 260, m = { t: 12, r: 12, b: 26, l: 52 };
  const vals = series.flatMap(s => [s.a, s.b, s.ly]).filter(v => v != null);
  const maxV = Math.max(...vals) * 1.08 || 1;
  const step = niceStep(maxV / 4);
  const top = Math.ceil(maxV / step) * step;
  const x = i => m.l + (W - m.l - m.r) * (i + .5) / 12;
  const y = v => m.t + (H - m.t - m.b) * (1 - v / top);
  const line = (key) => series.map((s, i) => s[key] == null ? null : [x(i), y(s[key])]).filter(Boolean).map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  let grid = "";
  for (let v = 0; v <= top + 1; v += step) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${fmtAED(v, 1)}</text>`;
  const xl = series.map((s, i) => (W < 480 && i % 2) ? "" : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[i]}</text>`).join("");
  const last = series.filter(s => s.a != null).length - 1;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Monthly net sales 2026: actual, budget and last year">
    ${grid}${xl}
    ${state.basis === "SKU" ? "" : `<path d="${line("b")}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="5 4"/>`}
    <path d="${line("ly")}" fill="none" stroke="var(--s2)" stroke-width="2"/>
    <path d="${line("a")}" fill="none" stroke="var(--s1)" stroke-width="2.5"/>
    ${last >= 0 ? `<circle cx="${x(last)}" cy="${y(series[last].a)}" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>` : ""}
    <line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <g id="dots"></g>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;
  const hit = host.querySelector("#hit"), tip = host.querySelector("#tip"), xh = host.querySelector("#xh"), dots = host.querySelector("#dots");
  const move = ev => {
    const r = host.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(11, Math.floor((px - m.l) / ((W - m.l - m.r) / 12))));
    const s = series[i];
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", ".5");
    dots.innerHTML = [["a", "--s1"], ["b", "--ref"], ["ly", "--s2"]].filter(([k]) => s[k] != null).map(([k, c]) => `<circle cx="${x(i)}" cy="${y(s[k])}" r="4" fill="var(${c})" stroke="var(--card)" stroke-width="2"/>`).join("");
    tip.hidden = false;
    tip.innerHTML = `<div class="t">${monLabel(s.k)}</div>
      <div class="r"><span>Actual</span><b>${s.a == null ? "not closed" : fmtAED(s.a)}</b></div>
      ${s.b != null ? `<div class="r"><span>Budget</span><b>${fmtAED(s.b)}</b></div>` : ""}
      <div class="r"><span>Last year</span><b>${fmtAED(s.ly)}</b></div>
      ${s.a != null && s.b != null ? `<div class="r"><span>vs budget</span><b>${fmtPct(pct(s.a, s.b))}</b></div>` : ""}
      ${s.a != null ? `<div class="r"><span>vs LY</span><b>${fmtPct(pct(s.a, s.ly))}</b></div>` : ""}`;
    const tx = Math.min(Math.max(x(i) + 12, 0), W - 170);
    tip.style.left = (x(i) > W - 190 ? x(i) - 172 : tx) + "px";
    tip.style.top = "8px";
  };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("opacity", "0"); dots.innerHTML = ""; });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

function spark(vals) {
  const w = 84, h = 24, max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const pts = vals.map((v, i) => [2 + (w - 4) * i / (vals.length - 1), h - 3 - (h - 6) * (v - min) / (max - min || 1)]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const e = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="${e[0]}" cy="${e[1]}" r="2.5" fill="var(--s1)"/></svg>`;
}

      execute: wrap("get_kpis", i => {
        const P = resolvePeriod(String(i.period)); const seg = segParam(i.segment), co = coParam(i.company); const basis = i.basis === "SKU" ? "SKU" : "PL";
        if (outOfScope(seg, co) || seg === "__NONE__" || co === "__NONE__") return EMPTY;
        const ii = linesFor(persona, { segment: seg, company: co });
        const t = sumLines(ii, String(i.period), basis); const sk = sumLines(ii, String(i.period), "SKU");
        return { period: P.long, basis, currency: "AED", net_sales: r0(t.act), budget: r0(t.bud), last_year: r0(t.ly), var_vs_budget: t.bud == null ? null : r0(t.act - t.bud), var_vs_budget_pct: p1(pct(t.act, t.bud)), var_vs_ly: r0(t.act - t.ly), var_vs_ly_pct: p1(pct(t.act, t.ly)), qty_units: r0(t.qty), avg_selling_price: sk.act && t.qty ? Math.round(sk.act / t.qty * 10) / 10 : null, other_income: r0(t.oi), notes: basis === "SKU" ? ["Budget is not held on SKU basis."] : [] };
      }),
    },
    {
      name: "get_breakdown",
      description: "Split net sales for a period by segment, company, sub-line, item category or month, with budget (PL basis) and last year. Use to find which part drove a variance.",
      inputSchema: { type: "object", properties: { period: periodProp, by: { type: "string", enum: ["segment", "company", "subline", "category", "month"] }, segment: segProp, company: coProp, basis: basisProp }, required: ["period", "by"] },
      execute: wrap("get_breakdown", i => {
        const P = resolvePeriod(String(i.period)); const seg = segParam(i.segment), co = coParam(i.company); const by = String(i.by);
        if (outOfScope(seg, co) || seg === "__NONE__" || co === "__NONE__") return EMPTY;
        const ii = linesFor(persona, { segment: seg, company: co });
        if (by === "category") {
          const rows = skuTable(persona, String(i.period), { segment: seg, company: co });
          const m = new Map(); rows.forEach(r => { const o = m.get(r.sku.cat) || { key: r.sku.cat, net_sales: 0, last_year: 0, qty: 0 }; o.net_sales += r.sales; o.last_year += r.ly; o.qty += r.qty; m.set(r.sku.cat, o); });
          return { period: P.long, basis: "SKU", currency: "AED", rows: [...m.values()].map(o => ({ key: o.key, net_sales: r0(o.net_sales), last_year: r0(o.last_year), var_vs_ly_pct: p1(pct(o.net_sales, o.last_year)), qty_units: r0(o.qty) })).sort((a, b) => b.net_sales - a.net_sales) };
        }
        const basis = i.basis === "SKU" ? "SKU" : "PL";
        if (by === "month") {
          return { basis, currency: "AED", rows: P.months.map(k => { const t = sumLines(ii, P.mtd ? "2026-10-MTD" : k, basis); return { key: P.mtd ? "Oct 2026 MTD" : monLabel(k), net_sales: r0(t.act), budget: r0(t.bud), last_year: r0(t.ly), var_vs_budget_pct: p1(pct(t.act, t.bud)), var_vs_ly_pct: p1(pct(t.act, t.ly)) }; }) };
        }
        const keyOf = { segment: L => SEG[L.seg].label, company: L => COMPANIES[L.co], subline: L => L.sub }[by];
        if (!keyOf) throw new Error("by must be segment, company, subline, category or month");
        const g = new Map(); ii.forEach(x => { const k = keyOf(LINES[x]); (g.get(k) || g.set(k, []).get(k)).push(x); });
        const rows = [...g.entries()].map(([k, xs]) => { const t = sumLines(xs, String(i.period), basis); return { key: k, net_sales: r0(t.act), budget: r0(t.bud), last_year: r0(t.ly), var_vs_budget: t.bud == null ? null : r0(t.act - t.bud), var_vs_budget_pct: p1(pct(t.act, t.bud)), var_vs_ly_pct: p1(pct(t.act, t.ly)) }; }).sort((a, b) => b.net_sales - a.net_sales);
        return { period: P.long, basis, currency: "AED", rows };
      }),
    },
    {
      name: "get_sku_ranking",
      description: "Rank SKUs (SKU basis, no budget) for a period by net sales, quantity, growth vs last year or decline vs last year. Returns up to top_n rows with LY and change.",
      inputSchema: { type: "object", properties: { period: periodProp, sort_by: { type: "string", enum: ["net_sales", "qty", "growth_vs_ly", "decline_vs_ly"] }, top_n: { type: "integer", minimum: 1, maximum: 25 }, segment: segProp, company: coProp, category: { type: "string", description: `Item category: ${CATEGORIES.join(", ")} or ALL` } }, required: ["period", "sort_by"] },
      execute: wrap("get_sku_ranking", i => {
        const P = resolvePeriod(String(i.period)); const seg = segParam(i.segment), co = coParam(i.company);
        if (outOfScope(seg, co) || seg === "__NONE__" || co === "__NONE__") return EMPTY;
        const rows = skuTable(persona, String(i.period), { segment: seg, company: co, category: i.category ? String(i.category) : "ALL" });
        const sorters = { net_sales: (a, b) => b.sales - a.sales, qty: (a, b) => b.qty - a.qty, growth_vs_ly: (a, b) => (b.sales - b.ly) - (a.sales - a.ly), decline_vs_ly: (a, b) => (a.sales - a.ly) - (b.sales - b.ly) };
        rows.sort(sorters[i.sort_by] || sorters.net_sales);
        const n = Math.min(Math.max(Number(i.top_n) || 10, 1), 25);
        return { period: P.long, basis: "SKU", currency: "AED", rows: rows.slice(0, n).map(r => ({ sku: r.sku.no, description: r.sku.desc, category: r.sku.cat, abc: r.abc, qty_units: r0(r.qty), net_sales: r0(r.sales), last_year: r0(r.ly), change_vs_ly: r0(r.sales - r.ly), change_vs_ly_pct: p1(pct(r.sales, r.ly)), avg_selling_price: r.qty ? Math.round(r.sales / r.qty * 10) / 10 : null })) };
      }),
    },
    {
      name: "get_metric_definition",
      description: "Return the approved definition of a metric (net_sales, budget, other_income, qty, asp, basis, ly, mtd_budget, abc, segments).",
      inputSchema: { type: "object", properties: { metric: { type: "string" } }, required: ["metric"] },
      execute: wrap("get_metric_definition", i => ({ metric: i.metric, definition: DEFS[String(i.metric).toLowerCase()] || "No approved definition for that metric. Known: " + Object.keys(DEFS).join(", ") })),
    },
    {
      name: "get_data_status",
      description: "Freshness, known data caveats and provisional mappings that affect the figures. Call when asked about reliability or before explaining an unusual movement.",
      execute: wrap("get_data_status", () => ({ as_of: AS_OF, caveats: [
        "Travel Retail September 2026 is provisional: BSP settlement for airport sales is pending, so September is understated.",
        "Ramadan began mid-February in 2026 versus early March in 2025, so February 2026 is inflated and March 2026 depressed against last year.",
        "October 2026 is month-to-date (1–5 Oct). MTD budget and LY are phased by calendar days (5/31).",
        "UAE customer category 1181, Al Fakhra code 017 and the SNS division are provisionally mapped.",
        "COGS and gross margin are not available in this phase.",
      ] })),
    },
  ];
}
const DEFS = {
  net_sales: "P&L basis: G/L accounts 3* excluding Other Income accounts 30160–30163 and 30170, sign-reversed so sales are positive. SKU basis: item ledger Sales Amount (Actual) for sale entries, excluding VAT.",
  budget: "G/L budget for FY2026 (version 2026FSBUDJ for Bateel UAE/KSA, 2026BUD for Al Fakhra), accounts 3* excluding Other Income. Held by month, segment and department only, never per SKU or location.",
  other_income: "G/L accounts 30160–30163 and 30170, reported as a separate line and never inside net sales.",
  qty: "Item ledger quantity in base unit of measure, positive for sales.",
  asp: "Average selling price = SKU-basis net sales ÷ quantity.",
  basis: "P&L basis ties to the management accounts and carries budget. SKU basis comes from the item ledger, carries quantity and SKU detail, and excludes non-item revenue, so it is lower than P&L basis.",
  ly: "Last year on a like-for-like calendar: the same months one year earlier.",
  mtd_budget: "Monthly budget spread evenly across calendar days.",
  abc: "A = SKUs making up the first 80% of net sales, B = the next 15%, C = the remainder.",
  segments: SEGMENTS.map(s => `${s.code} = ${s.label}`).join("; "),
};

function rules() {
  const sc = scopeOf(state.persona);
  const page = TABS.find(t => t[0] === state.tab)[1];
  return `You are the sales analyst inside a sales dashboard for a food & retail group (dates, chocolate, cafés). Today is 6 October 2026; data is loaded to ${AS_OF}.

USER SCOPE (read-only, enforced by the data tools, not by you): ${sc.name}. Segments: ${sc.segs.map(s => SEG[s].label).join(", ")}. Companies: ${sc.cos.map(c => COMPANIES[c]).join(", ")}. ${sc.group ? "The user may see group totals and rankings." : "Do NOT discuss group totals, rankings against other segments, or share of group: the user does not hold group access."}
If asked about anything outside this scope, say politely that it is outside their access and name only the segments they do have. Never hint whether other segments have data. If a tool returns an empty result, treat it as "no data in your scope".

CURRENT SCREEN: ${page}. Filters: period ${PERIODS[state.period].long} (${state.period}), compare to ${state.compare === "BUD" ? "budget" : "last year"}, basis ${state.basis}, company ${state.company}, segment ${state.segment}. Use these as defaults when the question does not say.

RULES
- Every figure must come from a tool result in this conversation. Never estimate, extrapolate or invent numbers. If data is missing, say so.
- Lead with the answer in one sentence. Then 2–4 supporting figures. Then the drivers ("why"), using get_breakdown, get_sku_ranking and get_data_status.
- Always state the period, AED and the basis (P&L or SKU).
- Budget exists only on P&L basis at segment/sub-line level. Never give budget per SKU; explain that budget is not held per SKU.
- Amounts: AED with K/M (e.g. AED 2.41M). Percentages to one decimal. UK English. Be concise: under 170 words unless a table is clearer.
- You may include one small markdown table (max 8 rows) when it clarifies.
- If the question is ambiguous, ask one short clarifying question instead of guessing.
- Gross margin and COGS are not available in this phase; say so if asked.
- End with exactly this block:
FOLLOW-UPS:
- <question 1>
- <question 2>
- <question 3>
(three short follow-up questions relevant to this screen and the user's scope)`;
}

function renderMd(src) {
  const lines = esc(src).split("\n");
  let html = "", list = false, tbl = [];
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const flushT = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    html += `<div class="md-tbl"><table><thead><tr>${rows[0].map((c, i) => `<th class="${i ? "" : "l"}">${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map((c, i) => `<td class="${i ? "" : "l"}">${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    tbl = [];
  };
  for (const raw of lines) {
    const l = raw.trim();
    if (l.startsWith("|")) { if (list) { html += "</ul>"; list = false; } tbl.push(l); continue; }
    flushT();
    if (/^[-•*] /.test(l)) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (/^#{1,4} /.test(l)) { html += `<h4>${inline(l.replace(/^#+ /, ""))}</h4>`; continue; }
    if (l) html += `<p>${inline(l)}</p>`;
  }
  flushT(); if (list) html += "</ul>";
  return html;
}
function splitFollowups(text) {
  const m = text.split(/\n\s*FOLLOW-?UPS:?\s*\n/i);
  if (m.length < 2) return { body: text, fus: [] };
  return { body: m[0].trim(), fus: m[1].split("\n").map(s => s.replace(/^[-•*\d.)\s]+/, "").trim()).filter(Boolean).slice(0, 3) };
}

let liveWorkingEl = null;
function renderWorkingLive(log) {
  if (!liveWorkingEl) return;
  liveWorkingEl.innerHTML = workingHtml(log, true);
}
function workingHtml(log, open) {
  if (!log.length) return "";
  return `<details class="working" ${open ? "open" : ""}><summary>Show working · ${log.length} tool call${log.length > 1 ? "s" : ""}</summary>${log.map(l =>
    `<div><b>${esc(l.tool)}</b> · scope filter ${esc(l.scope)} · ${l.rows} row${l.rows === 1 ? "" : "s"}<pre>${esc(JSON.stringify(l.input))}\n→ ${esc(JSON.stringify(l.result).slice(0, 900))}${JSON.stringify(l.result).length > 900 ? " …" : ""}</pre></div>`).join("")}</details>`;
}

const ERR = {
  not_granted: "The analyst needs your permission to use your Claude account. Reopen the page to be asked again.",
  rate_limited: "Too many questions in a short time. Wait a minute, then ask again.",
  prompt_too_large: "This conversation is too long. Start a new one by switching persona or reloading.",
  refused: "The analyst could not answer that. Try rephrasing.",
  upstream_error: "The connection to Claude dropped. Ask again.",
  session_expired: "Your session expired. Reload the page.",
  sampling_disabled: "Asking Claude is turned off for this account.",
  capability_disabled: "Asking Claude is turned off for this page.",
};

async function ask(question) {
  if (busy) return;
  const sample = await getSample();
  if (!sample) { showUnavailable(); return; }
  if (!turns.length) dBody.innerHTML = "";
  busy = true; sendBtn.hidden = true; stopBtn.hidden = false; qBox.value = "";
  dBody.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(question)}</div>`);
  const holder = document.createElement("div"); holder.className = "msg ai";
  holder.innerHTML = `<div class="ans"><span class="thinking">Thinking…</span></div><div class="wk"></div>`;
  dBody.appendChild(holder); holder.scrollIntoView({ block: "end" });
  const ans = holder.querySelector(".ans");
  liveWorkingEl = holder.querySelector(".wk");
  const log = [];
  turns.push({ role: "user", content: question });
  ctl = new AbortController();
  try {
    const { text, truncated } = await sample([{ role: "user", content: rules() }, ...turns], {
      signal: ctl.signal,
      tools: makeTools(log),
      onText: ({ text }) => { ans.innerHTML = renderMd(splitFollowups(text).body); },
    });
    const { body, fus } = splitFollowups(text);
    ans.innerHTML = renderMd(body) + (truncated ? `<p class="note">Answer cut short.</p>` : "");
    liveWorkingEl.innerHTML = workingHtml(log, false);
    if (!log.length) liveWorkingEl.innerHTML = `<div class="working">No data tools were called for this answer.</div>`;
    if (fus.length) {
      holder.insertAdjacentHTML("beforeend", `<div class="followups">${fus.map(f => `<button type="button">${esc(f)}</button>`).join("")}</div>`);
      holder.querySelectorAll(".followups button").forEach(b => b.onclick = () => ask(b.textContent));
    }
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    turns.pop();
    const kept = e && e.text ? renderMd(splitFollowups(e.text).body) : "";
    ans.innerHTML = kept + (e && e.code === "cancelled" ? `<p class="note">Stopped.</p>` : `<p class="note">${esc(ERR[e && e.code] || "Something went wrong. Ask again.")}</p>`);
    liveWorkingEl.innerHTML = workingHtml(log, false);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled")) sendBtn.disabled = true;
  } finally {
    busy = false; sendBtn.hidden = false; stopBtn.hidden = true; liveWorkingEl = null;
    holder.scrollIntoView({ block: "end" });
  }
}

render();
renderStarters();
</script>
